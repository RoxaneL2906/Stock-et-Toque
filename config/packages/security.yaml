security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    # On utilise l'entité Utilisateur comme source des comptes, en s'authentifiant par email
    providers:
        app_utilisateur_provider:
            entity:
                class: App\Entity\Utilisateur
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Route d'inscription et de connexion : accessibles sans être authentifié
        api_public:
            pattern: ^/api/(inscription|connexion|mot-de-passe-oublie|reinitialiser-mot-de-passe|rafraichir-token)
            stateless: true
            provider: app_utilisateur_provider

        # Toutes les autres routes /api nécessitent un access token JWT valide
        api:
            pattern: ^/api
            stateless: true
            provider: app_utilisateur_provider
            jwt: ~

        main:
            lazy: true
            provider: app_utilisateur_provider

    access_control:
        - {
              path: ^/api/(inscription|connexion|mot-de-passe-oublie|reinitialiser-mot-de-passe|rafraichir-token),
              roles: PUBLIC_ACCESS,
          }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
